<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f6f8; height: 100vh; display: flex; flex-direction: column; }
  header { background: #2c3e50; color: #fff; padding: 10px 12px; font-weight: 600; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  .header-btns { display: flex; gap: 6px; }
  header button {
    background: rgba(255,255,255,.08); color: rgba(255,255,255,.92);
    border: 1px solid rgba(255,255,255,.18); border-radius: 6px;
    padding: 4px 10px; font-size: 13px; cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .1s ease-out;
  }
  header button:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.3); }
  header button:active { transform: translateY(1px) scale(.97); background: rgba(255,255,255,.22); }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: #409eff; color: #fff; border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  footer { display: flex; gap: 8px; padding: 10px; background: #fff; border-top: 1px solid #e5e6eb; }
  #input { flex: 1; border: 1px solid #d0d3d9; border-radius: 8px; padding: 10px 12px; font-size: 15px; }
  #send { border: none; background: #409eff; color: #fff; border-radius: 8px; padding: 0 20px; font-size: 15px; cursor: pointer; transition: background .15s ease, transform .1s ease-out; }
  #send:hover { background: #66b1ff; }
  #send:active { transform: translateY(1px); }
  #report { background:#fff; border-bottom:1px solid #e5e6eb; }
  #reportBody { white-space: pre-wrap; padding:12px 16px 4px; overflow:hidden; }
  #reportBody.hidden { display:none; }
  #reportGrip { display:flex; justify-content:center; align-items:center; gap:6px; padding:6px 0; cursor:ns-resize; touch-action:none; user-select:none; }
  #reportGrip span { width:36px; height:4px; border-radius:2px; background:#d0d3d9; }
  #internshipPanel { background:#fff; border-bottom:1px solid #e5e6eb; }
  #internshipHeader { display:flex; align-items:center; gap:8px; padding:10px 16px; cursor:pointer; font-weight:600; user-select:none; }
  #internshipHeader:hover { background:#f7f8fa; }
  #internshipArrow { transition: transform .15s ease; color:#999; font-size:12px; }
  #internshipPanel.collapsed #internshipArrow { transform: rotate(-90deg); }
  #internshipList { white-space: pre-wrap; padding:0 16px 10px; font-size:14px; line-height:1.8; }
  #internshipList .empty { color:#999; }
</style>
</head>
<body>
<header><span class="app-title">🏫 校园助手</span><span class="header-btns">
  <button id="weekBtn">本周课表</button>
  <button id="importBtn">📥 导入课表</button>
  <button id="showItems">查看记录</button>
</span>
  <input type="file" id="importFile" accept=".xls,.xlsx" style="display:none"></header>
<div id="report" style="display:none;">
  <div id="reportBody"></div>
  <div id="reportGrip"><span></span><span></span></div>
</div>
<div id="internshipPanel" style="display:none;">
  <div id="internshipHeader">💼 实习列表 <span id="internshipArrow">▼</span></div>
  <div id="internshipList"></div>
</div>
<div id="importResult" style="display:none; padding:8px 16px; background:#fffbe6; border-bottom:1px solid #e5e6eb"></div>
<div id="messages"></div>
<footer>
  <input id="input" placeholder="粘贴老师通知，或问我问题…" autocomplete="off">
  <button id="send">发送</button>
</footer>
<script>
  const TOKEN_KEY = "campus-agent-token";
  let token = localStorage.getItem(TOKEN_KEY);
  if(!token){
    token = prompt("请输入口令：");
    if(token) localStorage.setItem(TOKEN_KEY, token);
  }

  const messages = document.getElementById("messages");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

    const importBtn = document.getElementById("importBtn");
    const importFile = document.getElementById("importFile");
    const importResult = document.getElementById("importResult");
    importBtn.onclick = () => importFile.click();
    importFile.onchange = async () => {
      const file = importFile.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append("file", file);
      importResult.style.display = "block";
      importResult.textContent = "正在导入 " + file.name + " …";
      try {
        const resp = await fetch("/api/import/excel", { method: "POST", headers: { "X-Access-Token": token }, body: fd });
        const data = await resp.json();
        importResult.textContent = data.error
            ? "导入失败：" + data.error
            : "📥 导入完成：成功 " + data.ok + " 条，失败 " + data.failed + " 条" + (data.failed ? "（失败行已存档，可在记录面板查看）" : "");
      } catch (err) {
        importResult.textContent = "导入出错：" + err;
      } finally {
        importFile.value = "";
      }
    };

    async function loadReport() {
      try {
        const resp = await fetch("/api/report/today", { headers: { "X-Access-Token": token } });
        if (resp.status === 401) return;
        const data = await resp.json();
        const el = document.getElementById("report");
        el.style.display = "block";
        document.getElementById("reportBody").textContent = data.content;
        initReportGrip();
      } catch (e) { /* 早报失败不阻塞聊天 */ }
    }

    /** 早报拖拽收起/展开：上滑隐藏、下滑显示，底部两条短线是手柄。拖到最顶则内容彻底隐藏（只留手柄），下拉重新出现。 */
    function initReportGrip() {
      const body = document.getElementById("reportBody");
      const grip = document.getElementById("reportGrip");
      const maxH = body.scrollHeight;
      let startY = 0, startH = 0, dragging = false;
      // 拖拽中的实时高度；若 body 处于 hidden，从 0 高度开始拉
      function currentHeight() {
        return body.classList.contains("hidden") ? 0 : body.getBoundingClientRect().height;
      }
      function applyHeight(h) {
        if (h <= 8) {
          body.classList.add("hidden");   // 彻底收起：内容消失，只留手柄
        } else {
          body.classList.remove("hidden");
          body.style.height = h + "px";
        }
      }
      applyHeight(maxH);   // 默认展开
      grip.addEventListener("pointerdown", (e) => {
        dragging = true;
        startY = e.clientY;
        startH = currentHeight();
        grip.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      grip.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const h = Math.max(0, Math.min(maxH, startH + (e.clientY - startY)));
        applyHeight(h);
      });
      const stop = () => { dragging = false; };
      grip.addEventListener("pointerup", stop);
      grip.addEventListener("pointercancel", stop);
    }
    loadReport();

    /** 实习列表：fetch /api/internships，渲染 #序号 公司-岗位 | 城市 | 截止 | 状态 */
    async function loadInternships() {
      try {
        const resp = await fetch("/api/internships", { headers: { "X-Access-Token": token } });
        if (resp.status === 401) return;
        const items = await resp.json();
        const panel = document.getElementById("internshipPanel");
        const list = document.getElementById("internshipList");
        panel.style.display = "block";
        if (!items.length) {
          list.innerHTML = '<div class="empty">（还没有实习记录，粘贴一条 JD 即可入库）</div>';
          return;
        }
        list.textContent = items.map(it =>
          `#${it.seq} ${it.title} | ${it.city || "?"} | 截止 ${it.deadline || "?"} | ${it.status || "?"}`
        ).join("\n");
      } catch (e) { /* 实习列表失败不阻塞聊天 */ }
    }
    loadInternships();

    // 实习列表折叠：点标题收起/展开
    document.getElementById("internshipHeader").onclick = () => {
      const panel = document.getElementById("internshipPanel");
      panel.classList.toggle("collapsed");
      document.getElementById("internshipList").style.display =
          panel.classList.contains("collapsed") ? "none" : "block";
    };



  function addBubble(text, who) {
    const div = document.createElement("div");
    div.className = "bubble " + who;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addBubble(text, "user");
    sendBtn.disabled = true;
    const bubble = addBubble("", "assistant");
    try {
      const resp = await fetch("/api/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Access-Token": token },
        body: JSON.stringify({ message: text })
      });
      if(resp.status == 401){
        localStorage.removeItem(TOKEN_KEY);
        bubble.textContent = "口令错误，请重新输入";
        return;
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let eventLines = [];          // 当前这条 SSE 事件的 data 行内容
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value,{stream:true});
        const parts = buffer.split("\n");
        buffer = parts.pop();
        for (const part of parts) {
          const line = part.trim();
          if (line.startsWith("data:")) {
            eventLines.push(line.substring(5).trim());
            continue;
          }
          // 空行 = 一条 SSE 事件结束：把事件内容按 \n 拼回，一次性追加
          if (line === "" && eventLines.length > 0) {
            bubble.textContent += eventLines.join("\n");
            eventLines = [];
            messages.scrollTop = messages.scrollHeight;
          }
        }
      }
      // 流结束收尾：最后一条事件可能没有空行结尾
      if (eventLines.length > 0) {
        bubble.textContent += eventLines.join("\n");
      }
      if(!bubble.textContent) addBubble("无回复", "assistant");
    } catch (err) {
      bubble.textContent = "网络错误：" + err;
    } finally {
      sendBtn.disabled = false;
    }
  }

    async function showItems() {
      try {
        const resp = await fetch("/api/items", {
          headers: { "X-Access-Token": token }
        });
        if (resp.status === 401) {
          localStorage.removeItem(TOKEN_KEY);
          alert("口令错误，请刷新页面重新输入");
          return;
        }
        const items = await resp.json();
        if (!items.length) {
          addBubble("（数据库还没有记录）", "assistant");
          return;
        }
        const lines = items.map(it => `[${it.type}] #${it.seq} 《${it.title}》 ${it.dueDate || it.startTime || "-"}${it.content ? " ｜ " + it.content : ""}`);
        addBubble(lines.join("\n"), "assistant");
      } catch (err) {
        addBubble("网络错误：" + err, "assistant");
      }
    }

    async function showWeek() {
      try {
        const resp = await fetch("/api/schedule/week", {
          headers: { "X-Access-Token": token }
        });
        if (resp.status === 401) {
          localStorage.removeItem(TOKEN_KEY);
          alert("口令错误，请刷新页面重新输入");
          return;
        }
        const days = await resp.json();
        const lines = [];
        for (const day of days) {
          lines.push(day.weekday + " " + day.date + "（" + day.status + "）");
          if (!day.courses.length) {
            lines.push("  （无）");
          } else {
            for (const c of day.courses) {
              lines.push(`  ${c.startTime || "?"}-${c.endTime || "?"} ${c.title} ${c.teacher || ""} ${c.location || ""}`);
            }
          }
        }
        addBubble(lines.join("\n"), "assistant");
      } catch (err) {
        addBubble("网络错误：" + err, "assistant");
      }
    }

    document.getElementById("weekBtn").onclick = showWeek;


    document.getElementById("showItems").onclick = showItems;


  sendBtn.onclick = send;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
