<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f6f8; height: 100vh; display: flex; flex-direction: column; }
  header { background: #2c3e50; color: #fff; padding: 12px 16px; font-weight: 600; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: #409eff; color: #fff; border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  footer { display: flex; gap: 8px; padding: 10px; background: #fff; border-top: 1px solid #e5e6eb; }
  #input { flex: 1; border: 1px solid #d0d3d9; border-radius: 8px; padding: 10px 12px; font-size: 15px; }
  #send { border: none; background: #409eff; color: #fff; border-radius: 8px; padding: 0 20px; font-size: 15px; cursor: pointer; }
    #report { white-space: pre-wrap; background:#fff; border-bottom:1px solid #e5e6eb; padding:12px 16px; }
</style>
</head>
<body>
<header>🏫 校园助手 <button id="importBtn" style="float:right">📥 导入课表</button>
  <button id="showItems" style="float:right;margin-right:8px;">查看记录</button>
  <input type="file" id="importFile" accept=".xls,.xlsx" style="display:none"></header>
<div id="report" style="display:none;"></div>
<div id="importResult" style="display:none; padding:8px 16px; background:#fffbe6; border-bottom:1px solid #e5e6eb"></div>
<div id="messages"></div>
<footer>
  <input id="input" placeholder="粘贴老师通知，或问我问题…" autocomplete="off">
  <button id="send">发送</button>
</footer>
<script>
  const TOKEN_KEY = "campus-agent-token";
  let token = localStorage.getItem(TOKEN_KEY);
  if(!token){
    token = prompt("请输入口令：");
    if(token) localStorage.setItem(TOKEN_KEY, token);
  }

  const messages = document.getElementById("messages");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

    const importBtn = document.getElementById("importBtn");
    const importFile = document.getElementById("importFile");
    const importResult = document.getElementById("importResult");
    importBtn.onclick = () => importFile.click();
    importFile.onchange = async () => {
      const file = importFile.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append("file", file);
      importResult.style.display = "block";
      importResult.textContent = "正在导入 " + file.name + " …";
      try {
        const resp = await fetch("/api/import/excel", { method: "POST", headers: { "X-Access-Token": token }, body: fd });
        const data = await resp.json();
        importResult.textContent = data.error
            ? "导入失败：" + data.error
            : "📥 导入完成：成功 " + data.ok + " 条，失败 " + data.failed + " 条" + (data.failed ? "（失败行已存档，可在记录面板查看）" : "");
      } catch (err) {
        importResult.textContent = "导入出错：" + err;
      } finally {
        importFile.value = "";
      }
    };

    async function loadReport() {
      try {
        const resp = await fetch("/api/report/today", { headers: { "X-Access-Token": token } });
        if (resp.status === 401) return;
        const data = await resp.json();
        const el = document.getElementById("report");
        el.style.display = "block";
        el.textContent = data.content;
      } catch (e) { /* 早报失败不阻塞聊天 */ }
    }
    loadReport();



  function addBubble(text, who) {
    const div = document.createElement("div");
    div.className = "bubble " + who;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addBubble(text, "user");
    sendBtn.disabled = true;
    const bubble = addBubble("", "assistant");
    try {
      const resp = await fetch("/api/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Access-Token": token },
        body: JSON.stringify({ message: text })
      });
      if(resp.status == 401){
        localStorage.removeItem(TOKEN_KEY);
        bubble.textContent = "口令错误，请重新输入";
        return;
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
        let finished = false;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value,{stream:true});
        const parts = buffer.split("\n");
        buffer =  parts.pop();
        for (const part of parts) {
          const line = part.trim();
          if (line.startsWith("event:done")) {
              finished = true;
              continue;
            }
            if (line.startsWith("data:")) {
            const text = line.substring(5).trim();
              if (finished) {
                bubble.textContent = text;
              } else {
                bubble.textContent += text;
              }
            messages.scrollTop = messages.scrollHeight;
          }
        }
      }
      if(!bubble.textContent) addBubble("无回复", "assistant");
    } catch (err) {
      bubble.textContent = "网络错误：" + err;
    } finally {
      sendBtn.disabled = false;
    }
  }

    async function showItems() {
      try {
        const resp = await fetch("/api/items", {
          headers: { "X-Access-Token": token }
        });
        if (resp.status === 401) {
          localStorage.removeItem(TOKEN_KEY);
          alert("口令错误，请刷新页面重新输入");
          return;
        }
        const items = await resp.json();
        if (!items.length) {
          addBubble("（数据库还没有记录）", "assistant");
          return;
        }
        const lines = items.map(it => `[${it.type}] #${it.seq} 《${it.title}》 ${it.dueDate || it.startTime || "-"}`);
        addBubble(lines.join("\n"), "assistant");
      } catch (err) {
        addBubble("网络错误：" + err, "assistant");
      }
    }

    document.getElementById("showItems").onclick = showItems;


  sendBtn.onclick = send;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
