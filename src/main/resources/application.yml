server:
  port: 8080
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/agent?allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:campus}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 老库（已有表但没有 flyway_schema_history）接入 Flyway 的关键开关：
    # 发现"库里有东西、但没有账本"时，先把现状登记成 baseline，不报错、不重放历史。
    baseline-on-migrate: true
    # 关键：baseline 版本设成 0，让 V1 真实执行一次。
    # 设成默认的 1 的话 V1 会被跳过，history 里只留一条 <baseline>，看不到真正的 V1。
    baseline-version: 0
  servlet:
      multipart:
        max-file-size: 5MB
        max-request-size: 5MB

app:
  api-key: ${DEEPSEEK_API_KEY:在这里填入你的key}
  model: deepseek-chat
  base-url: https://api.deepseek.com
  access-token: xinside
  report-cron: "0 0 7 * * ?"
        # report-cron: "0 0 7 * * ?"
