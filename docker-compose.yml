# 校园助手 · 全栈编排
#
# 一条命令起全套：docker compose up -d --build
# 浏览器打开：   http://localhost
#
# 说明：新版 Compose 不再需要 version: 字段（旧教程里的 version: "3.8" 已废弃）。
# 变量（MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD / DEEPSEEK_API_KEY）来自同目录的 .env，
# 它已被 .gitignore —— 密钥不进仓库。

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: agent          # 官方镜像会自动建这个库
      MYSQL_USER: campus             # 并自动建用户、授予该库的全部权限
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai              # 容器默认 UTC，created_at 会差 8 小时；功能无影响但统一更好
    volumes:
      - mysql-data:/var/lib/mysql    # 命名卷：删容器不丢数据
    # 注意：这里【不写 ports】。只有"从宿主机访问"才需要 ports；
    # app 在同一网络里用服务名 mysql 就能连到 3306，不需要对宿主机开口子。
    healthcheck:
      # 用 mysqladmin ping 判断"真的能用了"。$$ 是转义，
      # 让 $$MYSQL_ROOT_PASSWORD 交给容器内的 shell 展开，密码不必写进本文件。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s              # 首次初始化数据目录较慢，给足启动期

  app:
    build: .                         # 用仓库根的 Dockerfile 构建（镜像不存在时才会构建）
    image: campus-agent
    environment:
      DB_HOST: mysql                 # ← 关键：容器内用服务名，不是 localhost
      DB_USER: campus
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy   # 等 mysql 真的健康，而不只是"容器起来了"
    # 没有 healthcheck：eclipse-temurin JRE 镜像里没有 curl/wget，
    # 做不了 HTTP 探活。nginx 是上游探活无关的，短暂 502 会自动恢复，可接受。

  nginx:
    image: nginx:alpine
    ports:
      # 宿主机 8088 → 容器 80。容器里 nginx 仍监听 80，只是换了个"对外的窗口"。
      # 不用宿主机的 80：那里容易和系统服务/其他工具抢，而且 Windows 上可能出现
      # "up 不报错、连接却被别的进程接走"的情况（表现为返回一个不是 nginx 的 404），极难查。
      - "8088:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app                          # 只保证启动顺序；nginx 不会因上游没起来而崩

volumes:
  mysql-data:
