# 反向代理：把 http://localhost/ 转发到 app 容器的 8080
#
# 关键点全在 SSE 那几行 —— 见下方注释。

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://app:8080;          # 服务名当主机名（Compose 内部网络）
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # ===== SSE（/api/chat/stream 的流式输出）必须关掉缓冲 =====
        # nginx 默认会把上游响应攒进缓冲区、攒够再发。对普通页面无所谓，
        # 但对 SSE 是致命的：前端要的是"一个字一个字到达"，
        # 一旦被缓冲，打字机效果会变成"等十几秒，然后整段一次性蹦出来"。
        # 症状很像"后端没做流式"，其实是被代理憋住了。这是容器化部署里最常见的坑之一。
        proxy_buffering  off;
        proxy_cache      off;

        # SSE 是长连接：关闭 Connection 头 + 给足读超时，否则长回复会被提前掐断。
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
